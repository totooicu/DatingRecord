name: Deploy to GitHub Pages

# 本仓库的 Pages 源是「从分支部署（gh-pages）」，因此不能使用 actions/deploy-pages
# （它要求 Pages 源为 GitHub Actions，否则 deploy job 必然失败）。
# 这里改为：构建 → 用构建产物覆盖 gh-pages 分支。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: 用构建产物覆盖 gh-pages 分支
        run: |
          # 禁用 Jekyll，避免 Pages 忽略下划线开头的文件
          touch dist/.nojekyll
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ghp
          cd ghp
          # 身份必须配在内层克隆里：写在外层 checkout 不生效，而 ubuntu 运行器没有全局
          # git 身份 → git commit 报 "Author identity unknown"，整步失败、gh-pages 停更
          git config user.name "deploy bot"
          git config user.email "bot@localhost"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R ../dist/. .
          git add -A
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 部署构建产物到 gh-pages（main @ ${GITHUB_SHA::7}）"
          git push origin gh-pages
