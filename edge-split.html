<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>边缘分割工具 - 纯JS版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #333; }
        .controls {
            background: #fff; padding: 20px; border-radius: 10px;
            margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .control-row {
            display: flex; flex-wrap: wrap; gap: 15px;
            margin-bottom: 15px; align-items: center;
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 13px; color: #666; }
        .control-group input[type="range"] { width: 120px; }
button {
            padding: 10px 20px; border: none; border-radius: 6px;
            font-size: 15px; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #3a7bc8; }
        .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        #status {
            padding: 10px 15px; background: #f0f7ff; border-radius: 6px;
            margin-bottom: 15px; font-size: 14px; color: #333; min-height: 40px;
        }
        .preview-area {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 20px; margin-bottom: 20px;
        }
        .preview-box {
            background: #fff; padding: 15px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .preview-box h3 { margin-bottom: 10px; font-size: 16px; color: #333; }
.preview-box canvas { max-width: 100%; height: auto; border: 1px solid #eee; border-radius: 5px; }
        .results {
            background: #fff; padding: 20px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .results h3 { margin-bottom: 15px; color: #333; }
        .result-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;
        }
        .result-item {
            border: 1px solid #eee; border-radius: 8px; padding: 10px; text-align: center;
        }
        .result-item img { max-width: 100%; max-height: 120px; object-fit: contain; margin-bottom: 8px; }
        .result-item .info { font-size: 12px; color: #666; line-height: 1.4; }
        .log {
            background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px;
            font-family: monospace; font-size: 13px; max-height: 300px;
            overflow-y: auto; margin-top: 20px; white-space: pre-wrap;
        }
</style>
</head>
<body>
    <div class="container">
        <h1>🖼️ 边缘分割工具 (纯JS版，无依赖)</h1>

        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label>选择图片</label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                <button class="btn-primary" id="segmentBtn" disabled>开始分割</button>
                <button class="btn-secondary" id="downloadAllBtn" disabled>下载全部</button>
            </div>
            <div class="control-row">
                <div class="control-group">
                    <label>边缘阈值: <span id="thresholdVal">80</span></label>
                    <input type="range" id="threshold" min="20" max="200" value="80">
                </div>
                <div class="control-group">
                    <label>模糊强度: <span id="blurVal">2</span></label>
                    <input type="range" id="blur" min="0" max="5" value="2">
                </div>
<div class="control-group">
                    <label>最小面积: <span id="minAreaVal">3000</span></label>
                    <input type="range" id="minArea" min="500" max="50000" value="3000">
                </div>
                <div class="control-group">
                    <label>裁剪边距: <span id="marginVal">5</span></label>
                    <input type="range" id="margin" min="0" max="20" value="5">
                </div>
            </div>
        </div>

        <div id="status">✅ 就绪，请选择图片</div>

        <div class="preview-area">
            <div class="preview-box">
                <h3>原图</h3>
                <canvas id="originalCanvas"></canvas>
            </div>
            <div class="preview-box">
                <h3>边缘检测预览（绿色框）</h3>
                <canvas id="previewCanvas"></canvas>
            </div>
        </div>

        <div class="results">
            <h3>分割结果 (<span id="resultCount">0</span> 个元素)</h3>
            <div class="result-grid" id="resultGrid"></div>
</div>

        <div class="log" id="log"></div>
    </div>

    <script>
        let originalImage = null;
        let segmentResults = [];

        function log(msg) {
            const logEl = document.getElementById('log');
            logEl.textContent += msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(msg) {
            document.getElementById('status').innerHTML = msg;
        }

        // 参数滑块同步
        ['threshold', 'blur', 'minArea', 'margin'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                document.getElementById(id + 'Val').textContent = e.target.value;
            });
        });

        // 图片选择
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
img.onload = () => {
                    originalImage = img;
                    const canvas = document.getElementById('originalCanvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    setStatus(`✅ 图片已加载: ${img.width}x${img.height}`);
                    log(`[信息] 原图尺寸: ${img.width}x${img.height}`);
                    document.getElementById('segmentBtn').disabled = false;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ========== 纯JS图像处理函数 ==========

        // 灰度化
        function toGray(imageData) {
            const gray = new Uint8ClampedArray(imageData.width * imageData.height);
            const data = imageData.data;
            for (let i = 0; i < gray.length; i++) {
                gray[i] = (data[i*4] * 0.299 + data[i*4+1] * 0.587 + data[i*4+2] * 0.114) | 0;
}
            return gray;
        }

        // 高斯模糊
        function gaussianBlur(gray, width, height, radius) {
            if (radius === 0) return gray.slice();
            const kernel = [];
            const sigma = radius / 2;
            let sum = 0;
            for (let i = -radius; i <= radius; i++) {
                const v = Math.exp(-(i*i) / (2*sigma*sigma));
                kernel.push(v);
                sum += v;
            }
            for (let i = 0; i < kernel.length; i++) kernel[i] /= sum;

            // 水平方向
            const temp = new Uint8ClampedArray(gray.length);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let v = 0;
                    for (let k = -radius; k <= radius; k++) {
                        const xx = Math.min(width-1, Math.max(0, x+k));
                        v += gray[y*width + xx] * kernel[k+radius];
                    }
                    temp[y*width + x] = v;
}
            }
            // 垂直方向
            const result = new Uint8ClampedArray(gray.length);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let v = 0;
                    for (let k = -radius; k <= radius; k++) {
                        const yy = Math.min(height-1, Math.max(0, y+k));
                        v += temp[yy*width + x] * kernel[k+radius];
                    }
                    result[y*width + x] = v;
                }
            }
            return result;
        }

        // Sobel边缘检测
        function sobelEdge(gray, width, height, threshold) {
            const edges = new Uint8Array(gray.length);
            const gx = [-1,0,1,-2,0,2,-1,0,1];
            const gy = [-1,-2,-1,0,0,0,1,2,1];

            for (let y = 1; y < height-1; y++) {
                for (let x = 1; x < width-1; x++) {
                    let sx = 0, sy = 0;
                    for (let ky = -1; ky <= 1; ky++) {
for (let kx = -1; kx <= 1; kx++) {
                            const idx = (y+ky)*width + (x+kx);
                            const ki = (ky+1)*3 + (kx+1);
                            sx += gray[idx] * gx[ki];
                            sy += gray[idx] * gy[ki];
                        }
                    }
                    const mag = Math.sqrt(sx*sx + sy*sy);
                    edges[y*width + x] = mag > threshold ? 255 : 0;
                }
            }
            return edges;
        }

        // 膨胀操作
        function dilate(edges, width, height, iterations) {
            let result = edges.slice();
            for (let iter = 0; iter < iterations; iter++) {
                const temp = result.slice();
                for (let y = 1; y < height-1; y++) {
                    for (let x = 1; x < width-1; x++) {
                        if (temp[y*width+x] === 255) continue;
                        // 检查8邻域
                        let hasEdge = false;
for (let dy = -1; dy <= 1 && !hasEdge; dy++) {
                            for (let dx = -1; dx <= 1 && !hasEdge; dx++) {
                                if (temp[(y+dy)*width + (x+dx)] === 255) hasEdge = true;
                            }
                        }
                        if (hasEdge) result[y*width+x] = 255;
                    }
                }
            }
            return result;
        }

        // 连通区域分析（找轮廓）
        function findContours(edges, width, height) {
            const visited = new Uint8Array(edges.length);
            const contours = [];

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y*width + x;
                    if (edges[idx] === 255 && !visited[idx]) {
                        // BFS找连通区域
                        const region = [];
                        const queue = [[x, y]];
                        visited[idx] = 1;
                        let minX = x, maxX = x, minY = y, maxY = y;
while (queue.length > 0) {
                            const [cx, cy] = queue.shift();
                            region.push([cx, cy]);
                            minX = Math.min(minX, cx);
                            maxX = Math.max(maxX, cx);
                            minY = Math.min(minY, cy);
                            maxY = Math.max(maxY, cy);

                            for (let dy = -1; dy <= 1; dy++) {
                                for (let dx = -1; dx <= 1; dx++) {
                                    const nx = cx + dx, ny = cy + dy;
                                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                        const nidx = ny*width + nx;
                                        if (edges[nidx] === 255 && !visited[nidx]) {
                                            visited[nidx] = 1;
                                            queue.push([nx, ny]);
                                        }
                                    }
}
                            }
                        }

                        contours.push({
                            x: minX, y: minY,
                            w: maxX - minX + 1,
                            h: maxY - minY + 1,
                            area: region.length
                        });
                    }
                }
            }
            return contours;
        }

        // ========== 主分割函数 ==========
        function segmentImage() {
            if (!originalImage) {
                alert('请先选择图片');
                return;
            }

            setStatus('⏳ 正在进行边缘分割...');
            document.getElementById('segmentBtn').disabled = true;

            setTimeout(() => {
                try {
                    const threshold = parseInt(document.getElementById('threshold').value);
                    const blurRadius = parseInt(document.getElementById('blur').value);
                    const minArea = parseInt(document.getElementById('minArea').value);
const margin = parseInt(document.getElementById('margin').value);

                    log(`\n[参数] threshold=${threshold}, blur=${blurRadius}, minArea=${minArea}, margin=${margin}`);

                    const canvas = document.getElementById('originalCanvas');
                    const ctx = canvas.getContext('2d');
                    const width = canvas.width;
                    const height = canvas.height;
                    const imageData = ctx.getImageData(0, 0, width, height);

                    // 1. 灰度化
                    log('[步骤1] 灰度化...');
                    const gray = toGray(imageData);

                    // 2. 高斯模糊
                    log('[步骤2] 高斯模糊...');
                    const blurred = gaussianBlur(gray, width, height, blurRadius);

                    // 3. Sobel边缘检测
                    log('[步骤3] Sobel边缘检测...');
                    const edges = sobelEdge(blurred, width, height, threshold);

                    // 4. 膨胀
                    log('[步骤4] 边缘膨胀...');
const dilated = dilate(edges, width, height, 2);

                    // 5. 查找连通区域
                    log('[步骤5] 查找轮廓...');
                    const contours = findContours(dilated, width, height);
                    log(`[信息] 检测到 ${contours.length} 个原始轮廓`);

                    // 6. 过滤
                    const candidates = contours.filter(c => {
                        const aspectRatio = c.w / c.h;
                        return c.area >= minArea && c.area <= 500000 &&
                               aspectRatio >= 0.4 && aspectRatio <= 2.5;
                    });
                    candidates.sort((a, b) => b.area - a.area);
                    log(`[信息] 过滤后保留 ${candidates.length} 个候选区域`);

                    // 7. 绘制预览图
                    const previewCanvas = document.getElementById('previewCanvas');
                    previewCanvas.width = width;
                    previewCanvas.height = height;
                    const pctx = previewCanvas.getContext('2d');
pctx.drawImage(originalImage, 0, 0);
                    pctx.strokeStyle = '#00ff00';
                    pctx.lineWidth = 3;

                    candidates.forEach((c, idx) => {
                        pctx.strokeRect(c.x, c.y, c.w, c.h);
                        log(`  [${String(idx).padStart(2,'0')}] 位置=(${c.x},${c.y}) 尺寸=${c.w}x${c.h} 面积=${c.area} 宽高比=${(c.w/c.h).toFixed(2)}`);
                    });

                    // 8. 裁剪每个区域
                    segmentResults = [];
                    const resultGrid = document.getElementById('resultGrid');
                    resultGrid.innerHTML = '';

                    candidates.forEach((c, idx) => {
                        const x1 = Math.max(0, c.x - margin);
                        const y1 = Math.max(0, c.y - margin);
                        const x2 = Math.min(width, c.x + c.w + margin);
                        const y2 = Math.min(height, c.y + c.h + margin);

                        const cropCanvas = document.createElement('canvas');
cropCanvas.width = x2 - x1;
                        cropCanvas.height = y2 - y1;
                        cropCanvas.getContext('2d').drawImage(
                            originalImage, x1, y1, x2-x1, y2-y1, 0, 0, x2-x1, y2-y1
                        );
                        const dataUrl = cropCanvas.toDataURL('image/png');

                        segmentResults.push({
                            index: idx, bbox: [x1,y1,x2,y2],
                            size: [x2-x1, y2-y1], area: c.area, dataUrl
                        });

                        const item = document.createElement('div');
                        item.className = 'result-item';
                        item.innerHTML = `
                            <img src="${dataUrl}" alt="segment ${idx}">
                            <div class="info">#${idx} ${x2-x1}×${y2-y1}<br>面积: ${c.area}</div>
                        `;
                        resultGrid.appendChild(item);
                    });
document.getElementById('resultCount').textContent = candidates.length;
                    document.getElementById('downloadAllBtn').disabled = candidates.length === 0;
                    setStatus(`✅ 分割完成，共 ${candidates.length} 个元素`);
                    log(`\n[完成] 共分割出 ${candidates.length} 个元素`);

                } catch (err) {
                    console.error(err);
                    setStatus('❌ 分割失败: ' + err.message);
                    log('[错误] ' + err.message);
                } finally {
                    document.getElementById('segmentBtn').disabled = false;
                }
            }, 100);
        }

        // 下载全部
        function downloadAll() {
            segmentResults.forEach((result, idx) => {
                const a = document.createElement('a');
                a.href = result.dataUrl;
                a.download = `segment_${String(idx).padStart(3,'0')}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
            log('[信息] 已触发下载全部图片');
        }

        document.getElementById('segmentBtn').addEventListener('click', segmentImage);
        document.getElementById('downloadAllBtn').addEventListener('click', downloadAll);
    </script>
</body>
</html>
